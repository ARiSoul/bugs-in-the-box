<!DOCTYPE html>
<html lang="en">
  <head>

    <title>Bugs in the Box</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: radial-gradient(ellipse at 50% 30%, #2a3a5c 0%, #141a2b 70%); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: #dfe6f5; -webkit-user-select: none; user-select: none; }
      canvas { display: block; width: 100vw; height: 100vh; touch-action: none; object-fit: contain; }
      body.no-hud .box:not(#cineBar), body.no-hud #fps, body.no-hud #pad { display: none !important; }
      .box { position: fixed; background: rgba(12, 16, 28, 0.72); border: 1px solid rgba(160, 185, 255, 0.18); border-radius: 10px; padding: 8px 10px; font-size: 12px; line-height: 1.5; backdrop-filter: blur(6px); }

      input[type=number] { width: 84px; }
      input[type=range] { width: 90px; padding: 0; vertical-align: middle; }
      .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 6px; }

      #panel { left: 12px; top: 13vh; max-width: min(460px, calc(100vw - 24px)); }
      #panel summary { cursor: pointer; opacity: 0.8; }
      #panel:not([open]) { padding: 4px 10px; }
      #stats { white-space: pre-wrap; color: #a9c1ff; font-size: 11px; }

      #fps { position: fixed; right: 12px; top: 15.5vh; font-size: 12px; opacity: 0.7; }

      .meter { width: 110px; height: 7px; background: rgba(255, 255, 255, 0.12); border-radius: 4px; overflow: hidden; }
      .meter > div { height: 100%; width: 0%; background: #8fe3ff; }

      .skill { position: relative; overflow: hidden; border-radius: 7px; background: #1b2338; flex: none; border: 1px solid rgba(160, 185, 255, 0.3); box-sizing: content-box; }
      .skill.small { border-radius: 4px; grid-row: 1 / 3; }

      .skill .cold { color: #66718f; }

      .skill svg { width: 62%; }
      .skill.small svg { width: 78%; }
      .skill b { font-size: 9.5px; line-height: 1.1; font-weight: 600; width: 94%; }
      .skill i { position: absolute; left: 5px; top: 1px; font-size: 10px; font-style: normal; }
      .skill .hand { position: absolute; left: calc(50% - 1px); bottom: 50%; width: 2px; height: 100%; background: #ffe9bd; transform-origin: 50% 100%; }
      .skill.ready { border-color: #ffd27a; animation: ready 1.4s ease-in-out infinite; }
      @keyframes ready { 50% { outline: 3px solid rgba(255, 196, 107, 0.85); } 0%, 100% { outline: 3px solid rgba(255, 196, 107, 0.2); } }
      #pad { right: 12px; bottom: 12px; display: grid; grid-template-columns: repeat(3, 48px); grid-auto-rows: 44px; gap: 6px; padding: 8px; }
      #pad button { padding: 0; font-size: 16px; }
      #pad .fire { grid-column: 1 / 4; font-weight: 800; letter-spacing: 1px; }

      @media (max-width: 1000px) {
        #panel { max-width: 46vw; }
        /* open, the menu covers the other boxes, so its numbers can be read in full on a phone */
        #panel[open] { max-width: calc(100vw - 24px); z-index: 10; background: rgba(12, 16, 28, 0.94); }
        #fps { right: auto; left: 12px; top: 46px; font-size: 10px; max-width: calc(100vw - 250px); }
      }
      #cineBar { left: 50%; bottom: 18px; transform: translateX(-50%); display: none; gap: 10px; align-items: center; padding: 8px 14px; white-space: nowrap; transition: opacity 0.5s; }
      #cineBar small { opacity: 0.7; }
      @media (max-width: 760px) { #cineBar small, #cineBar span { display: none; } }
      body.cinematic #cineBar { display: flex; }
      body.cinematic.quiet #cineBar { opacity: 0; pointer-events: none; }
      body.cinematic.quiet { cursor: none; }
      #banner { left: 50%; top: 30%; height: 12vh; transform: translate(-50%, -50%); display: none; background: none; border: 0; backdrop-filter: none; padding: 0; }
    /* a special attack's scene: the bars of a film, and nothing over the picture */
      body::before, body::after { content: ''; position: fixed; left: 0; right: 0; height: 0; background: #000; z-index: 5; transition: height 0.45s ease; pointer-events: none; }
      body::before { top: 0; }
      body::after { bottom: 0; }
      body.special::before, body.special::after { height: 9vh; }
      #sight { position: fixed; left: 0; top: 0; width: 44px; height: 44px; margin: -22px 0 0 -22px; pointer-events: none; display: none; z-index: 4; }
      #sight.on { display: block; }
      #sight circle, #sight path { fill: none; stroke: #eafcff; stroke-width: 2; filter: drop-shadow(0 0 3px #1fa8ff); }
      #sight circle.pull { stroke: #58d8ff; stroke-width: 4; }
      body.special > *:not(canvas):not(script) { opacity: 0; pointer-events: none; transition: opacity 0.25s; }
      /* ---- the match: the duel above, the hand below */
      #hud { position: fixed; inset: 0; z-index: 3; pointer-events: none; --red: #ff5a45; --blue: #5fb4ff; --amber: #ffb547; --ink: #f6efdf; --dim: #c2bbac; font-family: 'Bahnschrift', 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif; color: var(--ink); font-size: clamp(10px, 1.6vh, 18px); overflow: hidden; }
      body.menu #hud, body.no-hud #hud, body.cinematic #hud { display: none; }
      #hud button { font: inherit; color: inherit; border: 0; background: none; }
      #hud .duel { position: absolute; top: 1.6vh; width: calc(50vw - 7.4vh - 1.4vw); --c: var(--red); transition: filter 0.3s, opacity 0.3s; }
      #hud .side0 { left: 1.4vw; } #hud .side1 { right: 1.4vw; --c: var(--blue); }
      #hud .duel:not(.on) { --c: #a4483d; } #hud .duel.side1:not(.on) { --c: #4d82b0; }
      #hud::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 13vh; background: linear-gradient(180deg, rgba(8, 7, 6, 0.6), transparent); }
      #hud .health { position: relative; height: 3.5vh; background: #1a1513; transform: skewX(-12deg); overflow: hidden; border: 0.35vh solid #130f0c; box-sizing: border-box; }
      #hud .side1 .health { transform: skewX(12deg); }
      #hud .health u, #hud .health s { position: absolute; top: 0; bottom: 0; right: 0; }
      #hud .side1 .health u, #hud .side1 .health s { right: auto; left: 0; }
      #hud .health u { background: linear-gradient(180deg, color-mix(in srgb, var(--c) 72%, #fff) 0 38%, var(--c) 38% 82%, color-mix(in srgb, var(--c) 78%, #000) 82%); transition: width 0.25s ease-out; }
      #hud .health s { background: #fff3d8; transition: width 0.9s 0.55s cubic-bezier(0.6, 0, 0.4, 1); }
      #hud .duel.on .health { box-shadow: 0 0 0 0.35vh var(--c); }
      #hud .duel.hurt .health { animation: hurt 0.45s; }
      @keyframes hurt { 20% { translate: 0.7vw 0.4vh; } 45% { translate: -0.6vw -0.3vh; } 70% { translate: 0.3vw 0.1vh; } }
      #hud .total { position: absolute; top: 0.35vh; height: 2.8vh; line-height: 2.7vh; font-weight: 700; font-size: 1.4em; color: var(--ink); background: #130f0c; padding: 0 0.5em; min-width: 1.9em; text-align: center; transform: skewX(-12deg); } #hud .side1 .total { transform: skewX(12deg); }
      #hud .side0 .total { left: 0.5em; } #hud .side1 .total { right: 0.5em; }
      #hud .team-name { position: absolute; top: 4.4vh; height: 3.6vh; } #hud .side0 .team-name { left: 0; } #hud .side1 .team-name { right: 0; }
      #hud .row3 { position: absolute; top: 4.5vh; display: flex; align-items: flex-start; gap: 0.5em; } #hud .row3 .skill { width: 4.6vh; height: 5.9vh; margin: 0 0.5em; background: #1b2338; border-color: #130f0c; } #hud .row3 .skill::after { content: ''; position: absolute; left: 0; bottom: 0; height: 0.6vh; width: calc(var(--load, 0) * 100%); background: var(--amber); } #hud .side0 .row3 { right: 0; flex-direction: row-reverse; } #hud .side1 .row3 { left: 0; }
      #hud .chip { width: 4.4em; background: #1a1513; padding: 0.25em 0.35em 0.4em; color: var(--c); transform: skewX(-8deg); transition: transform 0.25s cubic-bezier(0.2, 1.8, 0.4, 1), background 0.2s; }
      #hud .side1 .chip { transform: skewX(8deg); }
      #hud .chip svg { display: block; width: 100%; } #hud .side1 .chip svg { transform: scaleX(-1); }
      #hud .chip i { display: block; height: 0.36em; background: rgba(255, 255, 255, 0.18); margin-top: 0.15em; } #hud .chip u { display: block; height: 100%; background: currentColor; transition: width 0.3s; margin-left: auto; } #hud .side1 .chip u { margin-left: 0; }
      #hud .chip.active { background: var(--c); color: #160d0a; transform: skewX(-8deg) translateY(0.35em) scale(1.12); } #hud .side1 .chip.active { transform: skewX(8deg) translateY(0.35em) scale(1.12); }
      #hud .chip.dead { color: #6d675e; } #hud .chip.dead svg { transform: scaleY(-1); } #hud .side1 .chip.dead svg { transform: scale(-1, -1); } #hud .chip.dead i { visibility: hidden; }
      #hud .clock { position: absolute; left: 50%; top: 0.9vh; width: 13vh; height: 9.4vh; margin-left: -6.5vh; display: grid; place-content: center; justify-items: center; background: var(--amber); clip-path: polygon(0 0, 100% 0, 88% 78%, 50% 100%, 12% 78%); transition: background 0.2s; }
      #hud .clock .digits { height: 5.2vh; margin-top: -1vh; display: flex; gap: 0.6vh; align-items: center; } #hud .clock .digits b { width: 1.1vh; height: 1.1vh; background: #1b1206; animation: blink 1s steps(2) infinite; } #hud .clock .digits b:nth-child(2) { animation-delay: 0.2s; } #hud .clock .digits b:nth-child(3) { animation-delay: 0.4s; }
      #hud .clock small { color: #1b1206; font-weight: 700; font-size: 0.8em; line-height: 1; position: absolute; left: 0; right: 0; bottom: 1.5vh; text-align: center; }
      #hud .clock.retreat { background: #9fd6a0; } #hud .clock.urgent { background: #fff6e2; } #hud .clock.tick { animation: tock 0.4s cubic-bezier(0.2, 1.8, 0.4, 1); }
      @keyframes tock { from { transform: scale(1.32); } 45% { transform: rotate(-5deg); } 70% { transform: rotate(4deg); } }
      #hud .wind { position: absolute; left: 50%; top: 11.9vh; transform: translateX(-50%) skewX(-8deg); display: flex; align-items: center; gap: 0.6em; background: rgba(15, 12, 11, 0.8); padding: 0.3em 0.9em; }
      #hud .wind span { color: var(--dim); font-size: 0.9em; } #hud .wind i { width: 1.8em; height: 1.2em; background: var(--ink); clip-path: polygon(0 34%, 55% 34%, 55% 0, 100% 50%, 55% 100%, 55% 66%, 0 66%); transition: transform 0.1s linear; }
      #hud .force { display: flex; gap: 0.2em; } #hud .force u { width: 0.55em; height: 1em; background: rgba(255, 255, 255, 0.17); } #hud .force u.on { background: #8fe3ff; }
      #hud .wind.calm i { opacity: 0.25; }
      #hud .call { position: absolute; left: 26vw; top: 30vh; height: 8.5vh; transform: translateX(-50%); opacity: 0; display: grid; justify-items: center; }
      #hud .call .letters { height: 8.5vh; } #hud .call span { background: #130f0c; padding: 0.2em 1em 0.3em; margin-top: -0.2em; transform: skewX(-8deg); font-weight: 600; white-space: nowrap; }
      #hud .call.on { animation: callin 1.35s both; }
      @keyframes callin { 0% { opacity: 0; transform: translateX(-50%) scale(2.2) rotate(-5deg); } 14% { opacity: 1; transform: translateX(-50%) scale(1) rotate(-2deg); } 80% { opacity: 1; transform: translateX(-50%) scale(1.03) rotate(-1deg); } 100% { opacity: 0; transform: translate(-50%, -3vh) scale(1) rotate(-1deg); } }
      #hud .deck { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); display: grid; justify-items: center; transition: transform 0.45s cubic-bezier(0.3, 1.2, 0.4, 1); }
      #hud .deck.away { transform: translate(-50%, 105%); } #hud .deck.spent { transform: translate(-50%, 15vh); }
      #hud .aim { background: rgba(15, 12, 11, 0.82); padding: 0.25em 1em 0.35em; transform: skewX(-8deg); min-height: 1.3em; margin-bottom: 0.5em; white-space: nowrap; } #hud .aim:empty { visibility: hidden; } #hud .aim b { color: var(--amber); margin-right: 0.5em; }
      #hud .power { position: relative; width: 46vh; height: 1.9vh; background: rgba(15, 12, 11, 0.86); border: 0.3vh solid #130f0c; transform: skewX(-18deg); overflow: hidden; margin-bottom: 5.4vh; opacity: 0; transition: opacity 0.2s, box-shadow 0.2s; }
      #hud .power u { display: block; height: 100%; width: 0; background: var(--amber); } #hud .power s { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 2px), #130f0c calc(10% - 2px) 10%); }
      #hud .power.on { opacity: 1; box-shadow: 0 0 0 0.3vh var(--amber); } #hud .power.hot u { background: #ff5a45; } #hud .power.hot { box-shadow: 0 0 0 0.4vh #ff5a45; animation: hurt 0.12s infinite; }
      #hud .hand { display: flex; justify-content: center; height: 16vh; }
      #hud .slot { width: 11.4vh; margin: 0 -2.4vh; transform-origin: 50% 62vh; transform: rotate(var(--a)); transition: transform 0.22s cubic-bezier(0.2, 1.7, 0.4, 1); pointer-events: auto; }
      #hud .slot.on { transform: rotate(var(--a)) translateY(-4.2vh); z-index: 3; } #hud .slot:hover { transform: rotate(var(--a)) translateY(-2.4vh); z-index: 4; } #hud .slot.on:hover { transform: rotate(var(--a)) translateY(-4.6vh); }
      #hud .deal .slot { animation: deal 0.42s both cubic-bezier(0.2, 1.3, 0.4, 1); animation-delay: calc(var(--i) * 0.05s); }
      @keyframes deal { from { transform: rotate(0deg) translateY(22vh); } }
      #hud .card { width: 100%; height: 17vh; padding: 0; border-radius: 0.9vh !important; background: #1c1815 !important; border: 0.35vh solid #130f0c !important; box-shadow: inset 0 0 0 0.3vh color-mix(in srgb, var(--w) 45%, #2b251f); display: grid; grid-template-rows: 1fr auto; justify-items: center; align-items: center; cursor: pointer; position: relative; overflow: hidden; --b: #1c1815; color: var(--w); touch-action: none; }
      #hud .card::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 9.8vh; background: color-mix(in srgb, var(--w) 20%, #1c1815); clip-path: polygon(0 0, 100% 0, 100% 78%, 0 100%); }
      #hud .card svg { position: relative; width: 6.6vh; margin-top: -3.4vh; color: var(--w); --b: #2b251f; } #hud .card em { position: absolute; left: 0.8vh; top: 0.5vh; font-style: normal; font-weight: 700; font-size: 1.05em; color: var(--ink); z-index: 1; }
      #hud .facts { position: absolute; left: 0; right: 0; top: 12.6vh; display: grid; justify-items: center; gap: 0.2vh; } #hud .facts i { display: flex; gap: 0.3vh; } #hud .facts u { width: 0.9vh; height: 0.9vh; background: rgba(255, 255, 255, 0.16); transform: skewX(-12deg); } #hud .facts u.on { background: var(--w); } #hud .facts small { font-size: 0.8em; color: var(--dim); white-space: nowrap; } #hud .slot.on .facts u.on { background: #1b1206; } #hud .slot.on .facts u { background: rgba(27, 18, 6, 0.2); } #hud .slot.on .facts small { color: #4a3210; }
      #hud .card span { position: absolute; top: 9.9vh; left: 0.5vh; right: 0.5vh; font-weight: 600; font-size: 0.95em; line-height: 1.05; color: var(--ink); text-align: center; }
      #hud .slot.on .card { background: var(--amber) !important; box-shadow: inset 0 0 0 0.3vh #ffd89a, 0 0 0 0.45vh var(--c); } #hud .slot.on .card::before { background: #ffd08a; } #hud .slot.on .card svg { color: #1b1206; --b: #ffd08a; } #hud .slot.on .card span, #hud .slot.on .card em { color: #1b1206; }
      #hud .special-slot .skill { width: 100% !important; height: 17vh !important; border-radius: 0.9vh; border: 0.35vh solid #130f0c; box-sizing: border-box; cursor: pointer; } #hud .special-slot .skill .face { justify-content: flex-start; padding-top: 2vh; gap: 0.6vh; } #hud .special-slot .skill svg { width: 6.6vh; } #hud .special-slot .skill b { font-size: 0.95em; color: var(--ink); position: relative; z-index: 2; } #hud .special-slot .skill .cold { color: #7d88a8; } #hud .special-slot .skill .hand { opacity: 0.6; } #hud .special-slot .skill.ready::after { content: 'READY'; position: absolute; left: 0; right: 0; top: 12.4vh; text-align: center; font-weight: 700; font-size: 1em; background: var(--amber); color: #1b1206; padding: 0.1em 0 0.2em; } #hud .special-slot .skill i { left: 0.8vh; top: 0.5vh; font-size: 1.05em; font-weight: 700; } #hud .special-slot .skill .hand { display: block; height: 100%; transform-origin: 50% 100%; }
      #hud .special-slot.on .skill { box-shadow: 0 0 0 0.5vh #ffe9bd; }
      @media (max-width: 1000px) { #hud .team-name { display: none; } #hud .wind { top: 12vh; } #hud .deck { transform-origin: 50% 100%; scale: 0.8; } }
      /* ---- the setup screen and the end of a match */
      body.menu .box, body.menu #fps, body.menu #sight { display: none !important; }
      #panel:not([open]) { background: rgba(15, 12, 11, 0.82); border: 0; border-radius: 0; transform: skewX(-8deg); font-family: 'Bahnschrift', 'Segoe UI', sans-serif; } #fps { display: none; } body:has(#panel[open]) #fps { display: block; }
      @media (hover: hover) and (pointer: fine) { #pad { display: none; } }
      #setup[hidden], #ending[hidden] { display: none; }
      #setup, #ending { position: fixed; inset: 0; z-index: 8; --red: #ff5a45; --blue: #5fb4ff; --amber: #ffb547; --ink: #f6efdf; --dim: #c2bbac; --px: 0; --py: 0; font-family: 'Bahnschrift', 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif; color: var(--ink); font-size: clamp(11px, 1.62vh, 18px); overflow: hidden; }

      #setup button, #ending button { background: none; border: 0; border-radius: 3px; color: inherit; font: inherit; cursor: pointer; }
      #setup button:focus-visible, #ending button:focus-visible, #setup input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
      .letters { display: block; height: 100%; width: auto; overflow: visible; }
      #setup .logo { position: absolute; left: 50%; top: 2.2vh; width: 0; margin: 0; transform: translate(calc(var(--px) * -5px), calc(var(--py) * -4px)); transition: transform 0.25s ease-out; }
      #setup .logo span { position: absolute; display: block; }
      #setup .logo .l1 { height: 15.5vh; right: -2.4vh; top: 3vh; }
      #setup .logo .l3 { height: 15.5vh; left: 0.4vh; top: 3vh; }
      #setup .logo .l2 { height: 5vh; left: 0; top: 0; transform: translate(-47%, 0) rotate(-5deg); z-index: 2; background: #130f0c; padding: 0.4vh 0.9vh; border-radius: 3px; animation: plate 0.4s 1.1s both cubic-bezier(0.2, 1.8, 0.4, 1); }

      @keyframes slam1 { from { transform: translateY(-90px) scale(1.9) rotate(-12deg); opacity: 0; } 60% { opacity: 1; } }
      #setup .feel { transform-box: fill-box; transform-origin: 50% 100%; animation: feel 1.9s 1.6s infinite ease-in-out; }
      @keyframes feel { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(5deg) scaleY(1.08); } }

      #setup .versus::before { content: ''; position: absolute; inset: 0; background: #130f0c; clip-path: polygon(50% 0, 62% 13%, 82% 5%, 82% 24%, 100% 34%, 88% 50%, 100% 66%, 82% 76%, 82% 95%, 62% 87%, 50% 100%, 38% 87%, 18% 95%, 18% 76%, 0 66%, 12% 50%, 0 34%, 18% 24%, 18% 5%, 38% 13%); animation: slam 0.4s 1.35s both cubic-bezier(0.2, 1.6, 0.4, 1), buzz 2.6s 2s infinite; }

      #setup .called { position: absolute; left: 50%; top: 74vh; height: 10vh; opacity: 0; transform: translate(-50%, -50%); z-index: 4; }
      #setup .called.on { animation: called 0.3s both, calling 1.1s 0.3s infinite alternate ease-in-out; will-change: transform; }
      #setup .called.on.off { animation: gone 0.4s 0.35s both; }
      @keyframes called { from { opacity: 0; transform: translate(-50%, -50%) scale(2.6) rotate(-6deg); } to { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(-2deg); } }
      @keyframes calling { from { transform: translate(-50%, -50%) scale(1) rotate(-2deg); } to { transform: translate(-50%, -54%) scale(1.07) rotate(1deg); } }
      @keyframes gone { from { opacity: 1; transform: translate(-50%, -50%) rotate(-2deg); } to { opacity: 0; transform: translate(-50%, -50%) scale(1.5) rotate(-2deg); } }
      #setup .zone { position: absolute; top: 24vh; height: 56vh; width: 27vw; cursor: pointer; }
      #setup .zone.side0 { left: 21.5vw; } #setup .zone.side1 { right: 21.5vw; }
      #setup .team-card { position: absolute; top: 19vh; bottom: 15.5vh; width: 17.4vw; min-width: 210px; box-sizing: border-box; padding: 5vh 2.6vw 2vh 1.8vw; display: flex; flex-direction: column; justify-content: flex-start; gap: 1.6vh; isolation: isolate; transition: transform 0.4s cubic-bezier(0.5, 0, 0.9, 0.5); }
      #setup .team-card::before { content: ''; position: absolute; inset: 0 0 0 -8vw; z-index: -1; background: linear-gradient(180deg, var(--t1), rgba(9, 7, 7, 0.86) 62%); backdrop-filter: blur(7px); border-right: 4px solid var(--c); transform: skewX(-4deg); }
      #setup .team-card.side0 { left: 0; --c: var(--red); --t1: rgba(96, 18, 12, 0.82); animation: fromLeft 0.5s 0.5s both cubic-bezier(0.2, 1.1, 0.3, 1); }
      #setup .team-card.side1 { right: 0; --c: var(--blue); --t1: rgba(10, 40, 92, 0.82); text-align: right; padding: 5vh 1.8vw 2vh 2.6vw; animation: fromRight 0.5s 0.5s both cubic-bezier(0.2, 1.1, 0.3, 1); }
      #setup .team-card.side1::before { inset: 0 -8vw 0 0; border-right: 0; border-left: 4px solid var(--c); }
      @keyframes fromLeft { from { transform: translateX(-110%); } } @keyframes fromRight { from { transform: translateX(110%); } }
      #setup .chips { display: flex; gap: 0.5em; } #setup .side1 .chips { justify-content: flex-end; }
      #setup .chips button { padding: 0.35em 0.55em; color: var(--dim); background: rgba(255, 255, 255, 0.08); transform: skewX(-8deg); transition: transform 0.15s cubic-bezier(0.2, 2, 0.4, 1), color 0.15s; }
      #setup .chips svg { display: block; width: 3.5em; transform: skewX(8deg); } #setup .side1 .chips svg { transform: skewX(8deg) scaleX(-1); }
      #setup .chips button:hover { color: var(--ink); transform: skewX(-8deg) translateY(-4px) scale(1.06); }
      #setup .chips button.on { background: var(--c); color: #160d0a; }
      #setup .name { height: 6.6vh; display: flex; margin-left: -0.5vh; } #setup .side1 .name { justify-content: flex-end; margin: 0 -1vh 0 0; }
      #setup .name .letters { max-width: 100%; }
      #setup .team-card p { margin: 0; font-size: 1.2em; }
      #setup em { font-style: normal; color: var(--dim); font-size: 0.92em; }
      #setup .stats > div { display: flex; align-items: center; gap: 0.8em; margin-bottom: 0.5em; } #setup .side1 .stats > div { flex-direction: row-reverse; }
      #setup .stats em { width: 3.6em; } #setup .stats strong { width: 1.9em; text-align: right; } #setup .side1 .stats strong { text-align: left; }
      #setup .stats i { display: block; flex: 1; height: 0.75em; background: rgba(255, 255, 255, 0.13); transform: skewX(-18deg); }
      #setup .stats u { display: block; height: 100%; width: calc(var(--v) * 100%); background: repeating-linear-gradient(90deg, var(--c) 0 0.5em, transparent 0.5em 0.62em); transform-origin: 0 0; } #setup .side1 .stats u { margin-left: auto; transform-origin: 100% 0; }
      #setup .fresh .stats u { animation: grow 0.7s both cubic-bezier(0.2, 1.4, 0.4, 1); }
      #setup .fresh .name { animation: swap 0.35s both cubic-bezier(0.2, 1.6, 0.4, 1); }
      @keyframes grow { from { transform: scaleX(0); } } @keyframes swap { from { transform: translateY(0.6em) scale(0.8); opacity: 0; } }
      #setup .trait em, #setup .special em { color: var(--c); font-weight: 700; display: block; }
      #setup .special { display: flex; gap: 0.9em; align-items: center; } #setup .side1 .special { flex-direction: row-reverse; }
      #setup .emblem { width: 4.4em; height: 5.6em; flex: none; background: #2a1c0e; border: 1px solid rgba(255, 181, 71, 0.6); border-radius: 5px; display: grid; place-items: center; animation: ready 2.6s infinite ease-in-out; transition: transform 0.25s cubic-bezier(0.2, 2, 0.4, 1); }
      #setup .special:hover .emblem { transform: rotate(-6deg) scale(1.15); }
      #setup .emblem svg { width: 82%; }
      #setup .special b { display: block; font-size: 1.3em; line-height: 1.15; } #setup .special div span { color: var(--dim); line-height: 1.25; display: block; }
      #setup .who { display: flex; transform: skewX(-8deg); background: rgba(0, 0, 0, 0.55); }
      #setup .who button { flex: 1; padding: 0.65em 0; color: var(--dim); transition: background 0.15s; border-radius: 0; }
      #setup .who button:hover { background: rgba(255, 255, 255, 0.14); color: var(--ink); }
      #setup .who button.on { background: var(--c); color: #14100c; font-weight: 700; }
      #setup .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 15.5vh; display: flex; align-items: center; gap: 2vw; padding: 0 2vw; background: rgba(13, 11, 10, 0.94); border-top: 3px solid var(--amber); box-sizing: border-box; animation: rise 0.5s 0.2s both cubic-bezier(0.2, 1.1, 0.3, 1); transition: transform 0.35s ease-in; pointer-events: auto; }
      @keyframes rise { from { transform: translateY(100%); } }
      #setup .marchers { position: absolute; left: 0; bottom: 100%; width: 100%; height: 34px; cursor: crosshair; }
      #setup .shelf { display: flex; gap: 0.4vw; }
      #setup .device { display: grid; justify-items: center; align-content: center; gap: 0.5em; width: 5.7vw; min-width: 64px; height: 12vh; color: var(--dim); background: rgba(255, 255, 255, 0.05); transition: transform 0.2s cubic-bezier(0.2, 1.8, 0.4, 1), background 0.2s; padding: 0; }
      #setup .device svg { width: 6.2vh; overflow: visible; --a: color-mix(in srgb, var(--d) 62%, #3a352e); --b: #1d1916; }
      #setup .device .a { fill: var(--a); } #setup .device .b { fill: var(--b); } #setup .device svg * { transition: fill 0.2s; }
      #setup .device span { font-size: 0.78em; white-space: nowrap; }
      #setup .device:hover { transform: translateY(-6px); color: var(--ink); } #setup .device:hover svg { --a: var(--d); }
      #setup .device.on { transform: translateY(-11px); color: #14100c; background: var(--d); font-weight: 700; } #setup .device.on svg { --a: #16110c; --b: var(--d); }
      #setup .device svg g, #setup .device svg path { transform-box: fill-box; transform-origin: center; }
      #setup .device:hover .spin, #setup .device.on .spin { animation: spin 1.2s linear infinite; transform-origin: 24px 31.5px; transform-box: view-box; }
      #setup .device:hover .thump, #setup .device.on .thump { animation: thump 0.5s ease-in-out infinite; }
      #setup .device:hover .swing, #setup .device.on .swing { animation: nudge 0.8s ease-in-out infinite; }
      #setup .device:hover .slide, #setup .device.on .slide { animation: slide 1.6s ease-in-out infinite; }
      #setup .device:hover .blink, #setup .device.on .blink { animation: blink 0.9s steps(2) infinite; }
      #setup .device:hover .needle, #setup .device.on .needle { animation: needle 1s ease-in-out infinite alternate; transform-origin: 100% 100%; }
      @keyframes spin { to { transform: rotate(360deg); } } @keyframes thump { 50% { transform: scale(1.1); } } @keyframes nudge { 50% { transform: translateX(3px); } }
      @keyframes slide { 50% { transform: scaleX(0.5); } } @keyframes blink { 50% { opacity: 0.2; } } @keyframes needle { to { transform: rotate(85deg); } }
      #setup .place { flex: 1; min-width: 12.5em; } #setup .place b { display: block; white-space: nowrap; font-size: 1.6em; line-height: 1.1; } #setup .place span { color: var(--dim); }
      #setup .rules { display: flex; gap: 1.2vw; }
      #setup .rule { text-align: center; white-space: nowrap; } .row2 { display: flex; align-items: center; justify-content: center; }
      #setup .rule strong { min-width: 3.4em; font-size: 1.2em; }
      #setup .step { min-width: 32px; height: 34px; padding: 0; font-size: 1.7em; line-height: 1; color: var(--amber); display: grid; place-items: center; background: rgba(255, 181, 71, 0.13); transform: skewX(-8deg); }
      #setup .step:hover { background: var(--amber); color: #1b1206; }
      #setup .dice svg { width: 22px; fill: none; stroke: currentColor; stroke-width: 2; display: block; transition: transform 0.4s cubic-bezier(0.2, 1.6, 0.4, 1); } #setup .dice:hover svg { transform: rotate(180deg) scale(1.15); }
      #setup input { width: 4.4em; text-align: center; font: inherit; font-weight: 700; font-size: 1.15em; color: inherit; background: rgba(255, 255, 255, 0.1); border: 0; border-radius: 3px; padding: 0.35em 0; }
      #setup .play, #ending .play { position: relative; overflow: hidden; background: var(--amber); height: 10.6vh; width: 23vh; flex: none; padding: 0; display: grid; place-items: center; transition: transform 0.18s cubic-bezier(0.2, 2, 0.4, 1); animation: call 2.2s 2s infinite; clip-path: none; transform: skewX(-6deg); }
      .play span { position: relative; z-index: 1; height: 5.2vh; display: block; transform: skewX(6deg); }
      #setup .play:hover, #ending .play:hover { transform: skewX(-6deg) scale(1.08) rotate(-2deg); background: #ffd08a; }
      #setup .play:active, #ending .play:active { transform: skewX(-6deg) scale(0.94); }
      .play::after { content: ''; position: absolute; top: 0; bottom: 0; width: 26%; left: -60%; background: rgba(255, 255, 255, 0.55); transform: skewX(-18deg); animation: shine 2.8s 1.6s infinite; }
      @keyframes shine { 0% { left: -40%; } 34%, 100% { left: 140%; } }
      @keyframes call { 0% { box-shadow: 0 0 0 0 rgba(255, 181, 71, 0.6); } 60%, 100% { box-shadow: 0 0 0 16px rgba(255, 181, 71, 0); } }
      #setup.leave .bar { transform: translateY(170%); animation: none; }
      #setup.leave .team-card { animation: none; } #setup.leave .team-card.side0 { transform: translateX(-125%); } #setup.leave .team-card.side1 { transform: translateX(125%); }
      #setup.leave .logo { transition: transform 0.3s ease-in; transform: translateY(-34vh); } #setup.leave .versus { display: none; }
      #loading { position: fixed; inset: 0; z-index: 20; background: #0d0b0a; display: grid; place-content: center; justify-items: center; gap: 2.4vh; font: 600 18px 'Bahnschrift', 'Segoe UI', system-ui, sans-serif; color: #c2bbac; }
      #loading i { width: 13vh; height: 13vh; border: 1.6vh solid #26201a; border-radius: 50%; background: conic-gradient(#ff5a45 0 14%, transparent 14% 33.3%, #ffb547 33.3% 47.3%, transparent 47.3% 66.6%, #5fb4ff 66.6% 80.6%, transparent 80.6%); animation: spin 1s linear infinite; will-change: transform; }
      #flash { position: fixed; inset: 0; z-index: 9; background: radial-gradient(circle at 50% 58%, #fff3d8 0 30%, #ffdf9e 90%); opacity: 0; pointer-events: none; }
      #flash.on { animation: flash 0.1s linear; }
      @keyframes flash { 0%, 65% { opacity: 1; } 66%, 100% { opacity: 0; } }
      #ending { pointer-events: none; display: flex; flex-direction: column; align-items: center; }
      #ending button { pointer-events: auto; }
      #ending .head { height: 14vh; margin-top: 4.5vh; max-width: 92vw; } #ending .head .letters { max-width: 92vw; }
      #ending .slam1 { animation-delay: calc(var(--i) * 0.045s); }
      #ending .counts { display: flex; gap: 2.4vw; margin-top: 2vh; margin-bottom: auto; background: rgba(9, 7, 7, 0.72); padding: 1vh 2.4vw; transform: skewX(-6deg); animation: swap 0.5s 0.45s both; }
      #ending .counts div { text-align: center; } #ending .counts b { font-size: 2.6em; line-height: 1; display: block; } #ending .counts span { color: var(--dim); }
      #ending .row2 { gap: 1.5em; margin-bottom: 5vh; animation: swap 0.5s 1s both; }
      #ending .play { width: 30vh; }
      #ending .ghost { font-size: 1.3em; padding: 0 1.4em; height: 10.6vh; background: rgba(9, 7, 7, 0.78); transform: skewX(-6deg); } #ending .ghost:hover { background: rgba(255, 255, 255, 0.2); }
      @media (max-height: 640px) { #setup .trait, #setup .team-card p { display: none; } }
      @media (max-width: 1100px) { #setup .place { display: none; } #setup .bar { flex-wrap: wrap; height: auto; padding: 1vh; } }
      @media (prefers-reduced-motion: reduce) { #setup *, #ending * { animation-duration: 0.01s !important; animation-iteration-count: 1 !important; } }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <svg id="sight" viewBox="-22 -22 44 44"><path d="M-20 0H-12M12 0H20M0-20V-12M0 12V20" /><circle r="1.2" /><circle class="pull" r="10" pathLength="100" stroke-dasharray="0 100" transform="rotate(-90)" /></svg>
    <div id="fps"></div>

    <div id="cineBar" class="box">
      <span>cinematic camera</span>
      <button id="cinePause">pause</button>
      <button id="cineLeave">back to the game</button>
      <small>Space pause · ← → skip · R restart · Esc leave</small>
    </div>

    <details id="panel" class="box">
      <summary>menu</summary>
      <div id="stats"></div>
      <div class="row">
        <button id="toSetup" title="choose the map, the teams and the rules">setup</button>
        <label>seed <input id="seed" type="number" /></label>
        <button id="regen">new match</button>
        <button id="rand">random</button>
        <button id="bench">benchmark</button>
        <button id="fly" title="fly freely round the map, just to look at it">free camera</button>
        <button id="cine" title="a film-like flight over the map, on its own">cinematic camera</button>
      </div>
      <div class="row">
        <button id="mute"></button>
        <label>volume <input id="volume" type="range" min="0" max="100" /></label>
        <label>music <input id="musicVolume" type="range" min="0" max="100" /></label>
        <label>room <input id="roomVolume" type="range" min="0" max="100" title="the sound of the place" /></label>
      </div>
      <div class="hint" id="hint"></div>
      <details id="keys">
        <summary>keys</summary>
        <div id="keyList"></div>
        <div class="row"><button id="keyReset">default keys</button></div>
      </details>
    </details>

    <div id="hud"></div>

    <div id="pad" class="box">
      <button data-action="aimUp" title="aim higher">⤴</button>
      <button data-action="forward" title="walk forward">▲</button>
      <button data-action="jump" title="jump">⇪</button>
      <button data-action="left" title="turn left">◀</button>
      <button data-action="back" title="walk back">▼</button>
      <button data-action="right" title="turn right">▶</button>
      <button data-action="aimDown" title="aim lower">⤵</button>
      <button data-action="run" title="run (hold with walk)">⇧</button>
      <span></span>
      <button class="fire" data-action="fire" title="hold to charge, release to fire">FIRE</button>
    </div>

    <div id="loading"><i></i><span>warming up the box</span></div>
    <div id="flash"></div>
    <div id="banner" class="box"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
