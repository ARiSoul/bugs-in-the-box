# Flow: Bugs in the Box - Map Creator Prompt
# Edit by hand or in the visual editor. Check with: agent-flow-studio-flows validate map-creator-prompt
version: 1
name: map-creator-prompt
title: Bugs in the Box - Map Creator Prompt
description: 'Interviews the human about a new map (text brief plus reference images/photos/videos) until
  the scene is approved, then composes the map prompt from the Bugs in the Box template and iterates until
  it is approved. Read-only: the result is a .md draft that the map-building flow takes as input.'
inputs:
  brief:
    type: markdown
    label: What you want (description)
    description: 'Describe the map: idea, mood, what it must or must not have, anything you already know.
      Can be short: the interviewer will ask for the rest.'
  references:
    type: file
    label: References (images, photos, videos)
    description: 'Optional visual references: mood boards, photos, screenshots, short videos.'
    required: false
    multiple: true
    accept: [.png, .jpg, .jpeg, .webp, .gif, .mp4, .webm, .mov, .pdf, .md, .txt]
  priorities:
    type: markdown
    label: Priorities (in order)
    default: |-
      1. Visual beauty and atmosphere
      2. Smooth performance on the target (frame-time gates)
      3. Determinism and reproducibility
      4. Bundle size
  target_os: {label: Target OS, default: Windows 11}
  target_browser: {label: Target browser, default: Chrome stable}
  target_gpu: {label: Target GPU, default: NVIDIA GeForce RTX 4070}
  target_cpu: {label: Target CPU, default: AMD Ryzen 7 7700X 8-Core}
  target_hz:
    type: integer
    label: Monitor refresh (Hz)
    default: 144
    min: 30.0
    max: 500.0
  target_res: {label: Target resolution, default: 2560x1440}
  gpu_avg_ms:
    type: number
    label: GPU avg frame time (ms)
    default: 6.9
    min: 0.5
    max: 50.0
  frame_max_ms:
    type: number
    label: Max frame time (ms)
    default: 16.6
    min: 1.0
    max: 100.0
  flythrough_seconds:
    type: integer
    label: Fly-through length (s)
    default: 60
    min: 5.0
    max: 600.0
  controls:
    type: markdown
    label: Controls
    default: |-
      - WASD move, Q/E down/up, mouse look (pointer lock), Shift fast, Ctrl slow
      - Mouse wheel changes fly speed
      - R resets the camera to the start area
  pose_count:
    type: integer
    label: Number of fixed poses
    default: 6
    min: 1.0
    max: 20.0
  pose_res: {label: Pose render resolution, default: 1920x1080}
  recording_seconds:
    type: integer
    label: Recording length (s)
    default: 10
    min: 2.0
    max: 120.0
  critic_pass_level:
    type: choice
    label: Critic passes when nothing above
    default: minor
    options: [blocker, major, minor]
task: 'Define a new Bugs in the Box map with the human and produce its approved build prompt. Brief: {brief}.
  Run id: {run_id}.'
orchestrator:
  prompt: |-
    You coordinate the definition of a new Bugs in the Box map with a human, up to an approved build prompt. The map itself is built later by another flow that takes this flow's final prompt as input.

    Rules:
    - Read-only: no agent changes the repository or any external system. The final prompt is a .md draft for human review.
    - Follow the graph. It has two human loops:
      1. Scene interview: after each scene_designer run, show the human its `questions` (if any) and `scene_review`. Send the human's reply verbatim to scene_designer (with its previous `scene`) and run it again. Go on to prompt_composer only when the human approves AND scene_designer.status is `ready_for_approval`; if the human approves while questions are still open, remind them of the open points and ask them to answer or confirm.
      2. Prompt review: show the human the `final_prompt` and the `fill_report`'s missing/TODO list. If they ask for changes, send their feedback verbatim to prompt_composer (with its previous `final_prompt`) and run it again, until they approve.
    - Never edit scene values or the prompt yourself; the agents do it.
    - Every conclusion needs evidence (evidence_ref: an input name, a reference file, a human answer or a scene key). Do not invent data; if something is missing, say what is missing.
    - At the end, show the approved final prompt.

start: scene_designer

agents:
  scene_designer:
    description: 'Run first and again after every human reply at approve_scene: interviews the human (brief
      + reference files) and proposes the SCENE values until the human approves them.'
    prompt_file: prompts/scene_designer.md
    tools: [io.read_file, io.view_image, io.view_video]
    inputs:
      brief: {from: input.brief, type: markdown}
      references: {from: input.references, type: file, required: false}
      priorities: {from: input.priorities, type: markdown}
    outputs:
      status:
        type: choice
        description: needs_answers while important questions are still open; ready_for_approval when every
          SCENE field is defined
        options: [needs_answers, ready_for_approval]
      questions:
        type: markdown
        description: Numbered questions for the human (empty when status is ready_for_approval)
        required: false
      scene:
        type: json
        description: Object with keys MAP_NAME, SCENARIO_ID, MAP_PITCH, MEDIUM, DEPTH_GRADIENT, LIGHT_FX,
          BOUNDARY_SURFACE, HERO_VEGETATION, TERRAIN, GROUND_AND_FLORA, LIFE, SET_PIECES, WORLD_BOUNDS,
          START_AREA, BOUNDARY_RULE (all strings; 'TBD' while still open)
      scene_review:
        type: markdown
        description: Current proposal as a table with rationale and evidence_ref, plus decisions taken
          so far and open points
        draft: true
      reference_notes:
        type: markdown
        description: 'One entry per reference: file name, whether it was seen, what to take from it, what
          to ignore, which SCENE fields it guides'
        required: false
      reference_files:
        type: file
        description: The original reference files, unchanged, for the map-building flow and its critics
        required: false
        multiple: true
    icon: message-circle
  prompt_composer:
    description: 'After the scene is approved, and again after every change request at review_prompt:
      fills the map template with the approved scene and the form''s parameters and returns the final
      prompt as a .md draft.'
    prompt_file: prompts/prompt_composer.md
    inputs:
      scene: {from: scene_designer.scene, type: json}
      reference_notes: {from: scene_designer.reference_notes, type: markdown, required: false}
      priorities: {from: input.priorities, type: markdown}
      target_os: {from: input.target_os, type: text}
      target_browser: {from: input.target_browser, type: text}
      target_gpu: {from: input.target_gpu, type: text}
      target_cpu: {from: input.target_cpu, type: text}
      target_hz: {from: input.target_hz, type: integer}
      target_res: {from: input.target_res, type: text}
      gpu_avg_ms: {from: input.gpu_avg_ms, type: number}
      frame_max_ms: {from: input.frame_max_ms, type: number}
      flythrough_seconds: {from: input.flythrough_seconds, type: integer}
      controls: {from: input.controls, type: markdown}
      pose_count: {from: input.pose_count, type: integer}
      pose_res: {from: input.pose_res, type: text}
      recording_seconds: {from: input.recording_seconds, type: integer}
      critic_pass_level: {from: input.critic_pass_level, type: choice}
    outputs:
      final_prompt:
        type: markdown
        description: The filled map prompt, ready to paste into a coding agent
        draft: true
      fill_report:
        type: markdown
        description: Each placeholder, its value and where it came from (evidence_ref)
    icon: file-text

gates:
  approve_scene: {kind: human, label: 'Answer the questions, ask for changes, or approve the scene'}
  review_prompt: {kind: human, label: Approve the final map prompt (or ask for changes)}
  done:
    kind: stop
    label: Prompt approved
    message: 'Map prompt approved: {scene_designer.scene.MAP_NAME}. Give the map-building flow prompt_composer.final_prompt
      and, if there are references, scene_designer.reference_files.'

edges:
- {from: scene_designer, to: approve_scene}
- from: approve_scene
  to: prompt_composer
  when: the human approved the scene values
  if: scene_designer.status == "ready_for_approval"
  label: approved
- from: approve_scene
  to: scene_designer
  when: the human answered the questions or asked for changes (pass their reply verbatim to scene_designer)
  label: answers / changes
- {from: prompt_composer, to: review_prompt}
- {from: review_prompt, to: done, when: the human approved the final prompt, label: approved}
- from: review_prompt
  to: prompt_composer
  when: the human asked for changes to the prompt (pass their feedback verbatim to prompt_composer)
  label: changes
workspace: {path: 'G:\repos\bugs-in-the-box'}

layout:
  scene_designer: {x: -110, y: 50}
  prompt_composer: {x: 249, y: 209}
  approve_scene: {x: 266, y: 97}
  review_prompt:
    x: -109
    y: 435
    compact: {w: 200, h: 35}
  done: {x: -95, y: 595}
